[project]
name = "ssh-agent-mcp"
version = "0.1.0"
description = "MCP server for SSH/SFTP/SCP via paramiko"
requires-python = ">=3.14"
dependencies = [
    "fastmcp>=4.2.1",
    "mcp>=2.3.0",
    "paramiko>=5.1.0",
    "scp>=0.16.2",
]

[project.scripts]
ssh-agent-mcp = "main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
only-include = ["main.py"]

[tool.ruff]
line-length = 100
target-version = "py314"
